# Publishes NOVA LANCE as a static site to GitHub Pages, so it can be played
# from any phone browser at:  https://<owner>.github.io/<repo>/
#
# One-time setup (in the repo on github.com):
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# After that, every push to this branch (or a manual "Run workflow") deploys.
name: Deploy NOVA LANCE to GitHub Pages

on:
  push:
    branches:
      - claude/browser-shmup-game-dpMVx
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site (only the files needed to play)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css js assets _site/
          [ -f demo.gif ] && cp demo.gif _site/ || true
          [ -f README.md ] && cp README.md _site/ || true

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
