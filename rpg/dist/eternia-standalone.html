  <style>
/* css/style.css — レターボックス表示とタッチUI（レスポンシブ対応） */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #05070f; color: #fff;
  font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  touch-action: none;
}
#stage {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
}
#game {
  display: block;
  image-rendering: pixelated;
  background: #000;
  box-shadow: 0 0 40px rgba(0,0,0,0.6);
}

/* タッチUI（既定は非表示。.touch のときだけ表示） */
#touch-ui { display: none; }
body.touch #touch-ui {
  display: block;
  position: fixed; inset: 0; pointer-events: none; z-index: 10;
}
.pad, .act {
  position: absolute; pointer-events: auto;
  background: rgba(40,60,110,0.55); color: #fff;
  border: 2px solid rgba(174,224,255,0.6); border-radius: 12px;
  font-size: 20px; font-weight: bold;
  display: flex; align-items: center; justify-content: center;
}
.pad.pressed, .act.pressed { background: rgba(255,210,63,0.7); color: #1a1a1a; }

/* 十字キー（左下） */
#dpad { position: absolute; left: 18px; bottom: 24px; width: 168px; height: 168px; }
body.left-handed #dpad { left: auto; right: 18px; }
#btn-up    { left: 56px; top: 0;    width: 56px; height: 56px; }
#btn-down  { left: 56px; top: 112px;width: 56px; height: 56px; }
#btn-left  { left: 0;    top: 56px; width: 56px; height: 56px; }
#btn-right { left: 112px;top: 56px; width: 56px; height: 56px; }

/* アクションボタン（右下） */
#actions { position: absolute; right: 18px; bottom: 24px; width: 180px; height: 168px; }
body.left-handed #actions { right: auto; left: 18px; }
#btn-confirm { right: 0;   bottom: 90px; width: 88px; height: 64px; background: rgba(60,110,80,0.6); }
#btn-cancel  { right: 96px;bottom: 30px; width: 80px; height: 56px; }
#btn-menu    { right: 0;   bottom: 10px; width: 88px; height: 50px; font-size: 15px; }

</style>
</head>

        ctx.quadraticCurveTo(cx + 6, top + 1, cx + 6.6, top + 4.5);
        ctx.quadraticCurveTo(cx, top + 2.5, cx - 6.6, top + 4.5);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = tint(cap, 0.2); ctx.fillRect(cx - 6.6, top + 4, 13.2, 1.4);
        ctx.strokeStyle = '#e85a5a'; ctx.lineWidth = 2; ctx.lineCap = 'round'; // 羽根
        ctx.beginPath(); ctx.moveTo(cx + 1.5, top - 1); ctx.quadraticCurveTo(cx + 7, top - 4.5, cx + 9.5, top - 1.5); ctx.stroke();
        ctx.lineCap = 'butt';
        ctx.fillStyle = hair; ctx.fillRect(cx - 5, top + 4.5, 10, 1.8); // 前髪
      }
    } else {
      // 村人：髪
      ctx.fillStyle = hair;
      if (dir === 'up') {
        ctx.beginPath(); ctx.ellipse(cx, top + 6, 6.2, 6.5, 0, 0, 7); ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(cx, top + 5, 6.2, Math.PI, 0);
        ctx.lineTo(cx + 6.2, top + 6); ctx.lineTo(cx + 4, top + 6); ctx.lineTo(cx + 3, top + 3.5);
        ctx.lineTo(cx - 3, top + 3.5); ctx.lineTo(cx - 4, top + 6); ctx.lineTo(cx - 6.2, top + 6);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = rgba('#a87a52', 0.6);
        ctx.beginPath(); ctx.arc(cx - 2, top + 2.5, 2, Math.PI, 0); ctx.fill();
      }
    }

    // 顔（向き別。後ろ向きは描かない。tでときどき まばたき）
    if (dir !== 'up') {
      const blink = Math.sin(t * 0.6) > 0.985;
      ctx.fillStyle = '#26203a';
      if (blink) { // 閉じ目（横線）
        if (dir === 'down') { ctx.fillRect(cx - 3.6, top + 7.4, 2.2, 0.9); ctx.fillRect(cx + 1.5, top + 7.4, 2.2, 0.9); }
        else if (dir === 'left') { ctx.fillRect(cx - 4.2, top + 7.4, 2.2, 0.9); }
        else if (dir === 'right') { ctx.fillRect(cx + 2.0, top + 7.4, 2.2, 0.9); }
      } else if (dir === 'down') {
        ctx.fillRect(cx - 3.5, top + 6.5, 1.8, 2.2); ctx.fillRect(cx + 1.7, top + 6.5, 1.8, 2.2);
        ctx.fillStyle = rgba('#d77', 0.5); ctx.fillRect(cx - 4, top + 9.5, 1.5, 1); ctx.fillRect(cx + 2.5, top + 9.5, 1.5, 1);
      } else if (dir === 'left') {
        ctx.fillRect(cx - 4, top + 6.5, 1.8, 2.2);
      } else if (dir === 'right') {
        ctx.fillRect(cx + 2.2, top + 6.5, 1.8, 2.2);
      }
    }
    ctx.restore();
  }

  // ── 会話用の簡易フェイス（正面・チビ顔）。cx,cy=中心, s=おおよその半径 ──
  drawFace(ctx, cx, cy, s = 22, opts = {}) {
    const color = opts.color || '#4fb2ff';
    const hair = opts.hair || '#5a3a26';
    const skin = '#f1c79a', skinSh = '#d8a574';
    ctx.save();
    // 襟/肩（服の色）
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx - s * 1.05, cy + s * 1.35); ctx.quadraticCurveTo(cx, cy + s * 0.55, cx + s * 1.05, cy + s * 1.35);
    ctx.lineTo(cx + s * 1.05, cy + s * 1.5); ctx.lineTo(cx - s * 1.05, cy + s * 1.5); ctx.closePath(); ctx.fill();
    // 頭（肌グラデ）
    const g = ctx.createLinearGradient(cx - s, cy - s, cx + s, cy + s);
    g.addColorStop(0, tint(skin, 0.12)); g.addColorStop(1, skinSh);
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(cx, cy, s * 0.82, s * 0.92, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = rgba('#3a2a16', 0.5); ctx.lineWidth = 1.5; ctx.stroke();
    // 髪（前髪つき）
    ctx.fillStyle = hair;
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.84, cy + s * 0.05);
    ctx.quadraticCurveTo(cx - s * 0.98, cy - s * 0.98, cx, cy - s * 1.04);
    ctx.quadraticCurveTo(cx + s * 0.98, cy - s * 0.98, cx + s * 0.84, cy + s * 0.05);
    ctx.quadraticCurveTo(cx + s * 0.5, cy - s * 0.22, cx + s * 0.34, cy - s * 0.04);
    ctx.quadraticCurveTo(cx, cy - s * 0.34, cx - s * 0.34, cy - s * 0.04);
    ctx.quadraticCurveTo(cx - s * 0.5, cy - s * 0.22, cx - s * 0.84, cy + s * 0.05);
    ctx.closePath(); ctx.fill();
    // 目（まばたき対応）＋ハイライト
    ctx.fillStyle = '#26203a';
    if (opts.blink) { // 閉じ目（横線）
      ctx.fillRect(cx - s * 0.44, cy + s * 0.14, s * 0.24, s * 0.06);
      ctx.fillRect(cx + s * 0.2, cy + s * 0.14, s * 0.24, s * 0.06);
    } else {
      ctx.beginPath(); ctx.ellipse(cx - s * 0.32, cy + s * 0.14, s * 0.1, s * 0.15, 0, 0, 7); ctx.ellipse(cx + s * 0.32, cy + s * 0.14, s * 0.1, s * 0.15, 0, 0, 7); ctx.fill();
      ctx.fillStyle = rgba('#ffffff', 0.85);
      ctx.beginPath(); ctx.arc(cx - s * 0.35, cy + s * 0.08, s * 0.035, 0, 7); ctx.arc(cx + s * 0.29, cy + s * 0.08, s * 0.035, 0, 7); ctx.fill();
    }
    ctx.fillStyle = rgba('#e08070', 0.35);
    ctx.beginPath(); ctx.arc(cx - s * 0.46, cy + s * 0.32, s * 0.12, 0, 7); ctx.arc(cx + s * 0.46, cy + s * 0.32, s * 0.12, 0, 7); ctx.fill();
    ctx.strokeStyle = rgba('#7a4a3a', 0.7); ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(cx, cy + s * 0.34, s * 0.16, 0.25, Math.PI - 0.25); ctx.stroke();
    ctx.restore();
  }

  // ── 手続きミニアイコン（どうぐ/装備/属性/コマンド）。cx,cy=中心, s=半径目安 ──
  drawIcon(ctx, cx, cy, s = 8, kind = 'material') {
    ctx.save(); ctx.translate(cx, cy); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const OL = 'rgba(10,12,22,0.9)';
    const line = (w = 1.4) => { ctx.lineWidth = w; ctx.strokeStyle = OL; ctx.stroke(); };
    const lg = (a, b) => { const g = ctx.createLinearGradient(-s, -s, s, s); g.addColorStop(0, a); g.addColorStop(1, b); return g; };
    const EC = { fire: '#ff6a3a', ice: '#7fd8ff', thunder: '#ffd23f', wind: '#7fe0a0', earth: '#cf9a52', light: '#fff0a0', dark: '#a878e0' };
    switch (kind) {
      case 'weapon': case 'attack':
        ctx.beginPath(); ctx.moveTo(-s * 0.55, s * 0.85); ctx.lineTo(s * 0.5, -s * 0.9); ctx.lineTo(s * 0.85, -s * 0.55); ctx.lineTo(-s * 0.2, s * 0.95); ctx.closePath();
        ctx.fillStyle = lg('#f2f6ff', '#9fb2cc'); ctx.fill(); line();
        ctx.strokeStyle = '#caa24a'; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(-s * 0.9, s * 0.35); ctx.lineTo(-s * 0.1, s * 1.0); ctx.stroke();
        break;
      case 'shield': case 'defend':
        ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(s * 0.85, -s * 0.6); ctx.lineTo(s * 0.7, s * 0.5); ctx.quadraticCurveTo(0, s * 1.05, -s * 0.7, s * 0.5); ctx.lineTo(-s * 0.85, -s * 0.6); ctx.closePath();
        ctx.fillStyle = lg('#7fb0e0', '#37618f'); ctx.fill(); line();
        ctx.strokeStyle = rgba('#ffffff', 0.7); ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(0, -s * 0.55); ctx.lineTo(0, s * 0.6); ctx.moveTo(-s * 0.45, -s * 0.05); ctx.lineTo(s * 0.45, -s * 0.05); ctx.stroke();
        break;
      case 'head':
        ctx.beginPath(); ctx.arc(0, s * 0.1, s * 0.8, Math.PI, 0); ctx.lineTo(s * 0.8, s * 0.45); ctx.lineTo(-s * 0.8, s * 0.45); ctx.closePath();
        ctx.fillStyle = lg('#cfd6e2', '#8a93a6'); ctx.fill(); line();
        ctx.fillStyle = '#caa24a'; ctx.fillRect(-s * 0.85, s * 0.32, s * 1.7, s * 0.22);
        break;
      case 'body':
        ctx.beginPath();
        ctx.moveTo(-s * 0.55, -s * 0.8); ctx.lineTo(s * 0.55, -s * 0.8); ctx.lineTo(s * 0.9, -s * 0.35); ctx.lineTo(s * 0.6, -s * 0.12);
        ctx.lineTo(s * 0.7, s * 0.9); ctx.lineTo(-s * 0.7, s * 0.9); ctx.lineTo(-s * 0.6, -s * 0.12); ctx.lineTo(-s * 0.9, -s * 0.35); ctx.closePath();
        ctx.fillStyle = lg('#b8804a', '#7a5026'); ctx.fill(); line();
        break;
      case 'accessory':
        ctx.lineWidth = 2.4; ctx.strokeStyle = lg('#ffe089', '#caa24a'); ctx.beginPath(); ctx.arc(0, s * 0.25, s * 0.6, 0, 7); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, -s * 0.95); ctx.lineTo(s * 0.3, -s * 0.45); ctx.lineTo(-s * 0.3, -s * 0.45); ctx.closePath(); ctx.fillStyle = EC.ice; ctx.fill(); line(1);
        break;
      case 'consumable': case 'item':
        ctx.beginPath(); ctx.moveTo(-s * 0.28, -s * 0.9); ctx.lineTo(s * 0.28, -s * 0.9); ctx.lineTo(s * 0.28, -s * 0.5);
        ctx.quadraticCurveTo(s * 0.72, -s * 0.18, s * 0.62, s * 0.55); ctx.quadraticCurveTo(s * 0.5, s * 0.95, 0, s * 0.95);
        ctx.quadraticCurveTo(-s * 0.5, s * 0.95, -s * 0.62, s * 0.55); ctx.quadraticCurveTo(-s * 0.72, -s * 0.18, -s * 0.28, -s * 0.5); ctx.closePath();
        ctx.fillStyle = lg('#7be0a0', '#2f9f6a'); ctx.fill(); line();
        ctx.fillStyle = rgba('#ffffff', 0.5); ctx.fillRect(-s * 0.18, -s * 0.95, s * 0.36, s * 0.3);
        break;
      case 'material':
        ctx.beginPath(); ctx.moveTo(0, -s * 0.9); ctx.lineTo(s * 0.85, -s * 0.2); ctx.lineTo(s * 0.5, s * 0.85); ctx.lineTo(-s * 0.5, s * 0.85); ctx.lineTo(-s * 0.85, -s * 0.2); ctx.closePath();
        ctx.fillStyle = lg('#9ad8ff', '#4a7fb0'); ctx.fill(); line();
        ctx.strokeStyle = rgba('#ffffff', 0.6); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, -s * 0.9); ctx.lineTo(0, s * 0.85); ctx.moveTo(-s * 0.85, -s * 0.2); ctx.lineTo(s * 0.85, -s * 0.2); ctx.stroke();
        break;
      case 'key':
        ctx.lineWidth = 2.2; ctx.strokeStyle = lg('#ffe089', '#caa24a');
        ctx.beginPath(); ctx.arc(-s * 0.3, -s * 0.3, s * 0.45, 0, 7); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-s * 0.02, -s * 0.02); ctx.lineTo(s * 0.8, s * 0.8); ctx.lineTo(s * 0.55, s * 0.95); ctx.stroke();
        break;
      case 'skill': case 'magic':
        ctx.fillStyle = lg('#fff0a0', '#ffb24a');
        ctx.beginPath();
        for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2; ctx.lineTo(Math.cos(a) * s, Math.sin(a) * s); const b = a + Math.PI / 4; ctx.lineTo(Math.cos(b) * s * 0.34, Math.sin(b) * s * 0.34); }
        ctx.closePath(); ctx.fill(); line(1);
        break;
      case 'escape':
        ctx.beginPath(); ctx.moveTo(-s * 0.5, -s * 0.8); ctx.lineTo(-s * 0.02, -s * 0.8); ctx.lineTo(s * 0.05, s * 0.4); ctx.lineTo(s * 0.9, s * 0.5); ctx.lineTo(s * 0.9, s * 0.9); ctx.lineTo(-s * 0.5, s * 0.9); ctx.closePath();
        ctx.fillStyle = lg('#a06a3c', '#653a20'); ctx.fill(); line();
        break;
      default: {
        const col = EC[kind];
        if (col) {
          ctx.fillStyle = lg(tint(col, 0.3), tint(col, -0.2)); ctx.strokeStyle = OL; ctx.lineWidth = 1.4;
          if (kind === 'fire') { ctx.beginPath(); ctx.moveTo(0, -s); ctx.quadraticCurveTo(s * 0.9, -s * 0.1, s * 0.45, s * 0.7); ctx.quadraticCurveTo(0, s * 1.05, -s * 0.45, s * 0.7); ctx.quadraticCurveTo(-s * 0.9, -s * 0.1, 0, -s); ctx.closePath(); ctx.fill(); line(); }
          else if (kind === 'ice') { ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3 - Math.PI / 2; ctx.lineTo(Math.cos(a) * s, Math.sin(a) * s); } ctx.closePath(); ctx.fill(); line(); }
          else if (kind === 'thunder') { ctx.beginPath(); ctx.moveTo(s * 0.2, -s); ctx.lineTo(-s * 0.5, s * 0.15); ctx.lineTo(0, s * 0.15); ctx.lineTo(-s * 0.2, s); ctx.lineTo(s * 0.6, -s * 0.2); ctx.lineTo(s * 0.05, -s * 0.2); ctx.closePath(); ctx.fill(); line(); }
          else if (kind === 'wind') { ctx.lineWidth = 2.2; ctx.strokeStyle = col; ctx.beginPath(); ctx.arc(-s * 0.1, -s * 0.1, s * 0.55, 0.4, Math.PI * 1.7); ctx.stroke(); ctx.beginPath(); ctx.arc(s * 0.2, s * 0.5, s * 0.32, 0, Math.PI * 1.6); ctx.stroke(); }
          else if (kind === 'earth') { ctx.beginPath(); ctx.moveTo(-s, s * 0.8); ctx.lineTo(-s * 0.2, -s * 0.3); ctx.lineTo(s * 0.1, s * 0.2); ctx.lineTo(s * 0.55, -s * 0.7); ctx.lineTo(s, s * 0.8); ctx.closePath(); ctx.fill(); line(); }
          else if (kind === 'light') { ctx.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; const rr = i % 2 ? s * 0.4 : s; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); line(1); }
          else if (kind === 'dark') { ctx.beginPath(); ctx.arc(0, 0, s, Math.PI * 0.5, Math.PI * 1.5); ctx.arc(s * 0.4, 0, s * 0.95, Math.PI * 1.5, Math.PI * 0.5, true); ctx.closePath(); ctx.fill(); line(); }
          else { ctx.beginPath(); ctx.arc(0, 0, s * 0.7, 0, 7); ctx.fill(); line(); }
        } else {
          ctx.beginPath(); ctx.arc(0, 0, s * 0.78, 0, 7); ctx.fillStyle = lg('#9aa6b8', '#5a6478'); ctx.fill(); line();
        }
      }
    }
    ctx.restore();
  }

  // ── 戦闘モンスター：系統が「見て分かる」シルエット＋陰影＋リムライト ──
  drawMonster(ctx, cx, cy, family, color, s = 1, t = 0) {
    ctx.save();
    ctx.translate(cx, cy);
    const r = 26 * s;
    // 接地影
    ctx.fillStyle = rgba('#000000', 0.32);
    ctx.beginPath(); ctx.ellipse(0, r * 0.95, r * 0.95, r * 0.28, 0, 0, 7); ctx.fill();

    // 部品アニメ：本体＋目をまとめて変形（接地影は固定のまま）
    ctx.save();
    if (family === 'slime' || family === 'elemental') {
      const j = Math.sin(t * 0.18) * 0.06; // ぷるんと伸縮（接地点を軸に）
      ctx.translate(0, r * 0.84); ctx.scale(1 + j, 1 - j); ctx.translate(0, -r * 0.84);
    } else if (family === 'undead') {
      ctx.translate(0, Math.sin(t * 0.07) * r * 0.07); // ふわふわ浮遊
    } else if (family === 'plant') {
      ctx.translate(0, r * 0.85); ctx.rotate(Math.sin(t * 0.11) * 0.05); ctx.translate(0, -r * 0.85); // 風にゆれる
    } else if (family === 'aqua') {
      const w = Math.sin(t * 0.14); ctx.translate(0, r * 0.8); ctx.scale(1 + w * 0.03, 1 - w * 0.03); ctx.rotate(w * 0.03); ctx.translate(0, -r * 0.8); // うねり
    }

    // ボディ用グラデ（左上から光）
    const grad = ctx.createRadialGradient(-r * 0.32, -r * 0.4, r * 0.15, 0, r * 0.1, r * 1.25);
    grad.addColorStop(0, tint(color, 0.4)); grad.addColorStop(0.55, color); grad.addColorStop(1, tint(color, -0.4));
    const outline = rgba(tint(color, -0.55), 0.85);
    const lw = Math.max(1.5, 2 * s);
    ctx.lineWidth = lw; ctx.strokeStyle = outline;
    const sc = hexToRgb(color);
    const shA = (a) => `rgba(${(sc.r * 0.3) | 0},${(sc.g * 0.3) | 0},${(sc.b * 0.3) | 0},${a})`; // 色付きの陰
    // 本体：塗り＋クリップして スペキュラ／フォームシャドウ／接地オクルージョンを重ね、球状の立体感を出す
    const body = () => {
      ctx.fillStyle = grad; ctx.fill(); ctx.stroke();
      ctx.save(); ctx.clip();
      const hl = ctx.createRadialGradient(-r * 0.4, -r * 0.52, r * 0.04, -r * 0.26, -r * 0.38, r * 1.15);
      hl.addColorStop(0, rgba('#ffffff', 0.36)); hl.addColorStop(0.34, rgba('#ffffff', 0.09)); hl.addColorStop(1, rgba('#ffffff', 0));
      ctx.fillStyle = hl; ctx.fillRect(-r * 2.2, -r * 2.6, r * 4.4, r * 4.8);
      const fs = ctx.createLinearGradient(-r * 0.5, -r * 0.5, r * 0.85, r * 0.95);
      fs.addColorStop(0, shA(0)); fs.addColorStop(0.56, shA(0)); fs.addColorStop(1, shA(0.55));
      ctx.fillStyle = fs; ctx.fillRect(-r * 2.2, -r * 2.2, r * 4.4, r * 4.4);
      const ao = ctx.createLinearGradient(0, r * 0.35, 0, r * 1.25);
      ao.addColorStop(0, rgba('#000000', 0)); ao.addColorStop(1, rgba('#000000', 0.30));
      ctx.fillStyle = ao; ctx.fillRect(-r * 2.2, r * 0.35, r * 4.4, r * 1.4);
      ctx.restore();
      ctx.fillStyle = grad; ctx.strokeStyle = outline; ctx.lineWidth = lw;
    };
    // パーツ（角・翼・耳ひれ等）：左上→右下の方向グラデで筒状のボリュームを出す
    const part = (sh) => {
      if (sh == null) { ctx.fillStyle = grad; ctx.fill(); ctx.stroke(); return; }
      const g = ctx.createLinearGradient(-r, -r, r, r);
      g.addColorStop(0, tint(color, Math.min(0.95, sh + 0.2)));
      g.addColorStop(1, tint(color, sh - 0.24));
      ctx.fillStyle = g; ctx.fill(); ctx.stroke();
    };
    // 落ち影（パーツ→本体の前後関係を出す、柔らかい楕円の陰）
    const castShadow = (x, y, rx, ry, a = 0.3, rot = 0) => {
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(rx, ry);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
      g.addColorStop(0, rgba('#000000', a)); g.addColorStop(0.55, rgba('#000000', a * 0.5)); g.addColorStop(1, rgba('#000000', 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 1, 0, 7); ctx.fill(); ctx.restore();
    };

    // 目の既定値（caseごとに上書き可。slit=縦長瞳）
    let eye = { x: r * 0.34, y: -r * 0.06, r: r * 0.2, slit: false, color: '#b3261e' };
    let drawEyes = true, rim = true;

    switch (family) {
      case 'dragon': { // 業火竜：大頭・大口（歯）・お腹/翼膜クリーム・茶角の飛行チビ竜（左向き）
        rim = false; drawEyes = false;
        const X = (v) => v * r, Y = (v) => v * r;
        const cream = () => { const g = ctx.createLinearGradient(0, Y(-0.6), 0, Y(0.9)); g.addColorStop(0, '#f6e0ad'); g.addColorStop(1, '#caa75e'); return g; };
        const hornFill = (x0, y0, x1, y1) => { const g = ctx.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, '#a26c3d'); g.addColorStop(1, '#653a20'); return g; };
        // 接地影（やや浮遊）
        ctx.fillStyle = rgba('#000000', 0.26);
        ctx.beginPath(); ctx.ellipse(X(-0.15), Y(1.2), X(1.25), Y(0.2), 0, 0, 7); ctx.fill();

        // === 翼（背後・赤い外枠＋クリームの膜・はばたき）===
        ctx.save();
        ctx.translate(X(0.16), Y(-0.3)); ctx.rotate(Math.sin(t * 0.06) * 0.13); ctx.translate(X(-0.16), Y(0.3)); // 付け根を軸にはばたく
        ctx.beginPath();
        ctx.moveTo(X(0.12), Y(-0.34));
        ctx.quadraticCurveTo(X(0.78), Y(-1.5), X(1.78), Y(-1.5));    // 上端→翼端
        ctx.quadraticCurveTo(X(1.5), Y(-1.0), X(1.82), Y(-0.72));    // スカラップ1
        ctx.quadraticCurveTo(X(1.4), Y(-0.72), X(1.58), Y(-0.28));   // スカラップ2
        ctx.quadraticCurveTo(X(1.16), Y(-0.36), X(1.22), Y(0.12));   // スカラップ3
        ctx.quadraticCurveTo(X(0.64), Y(-0.12), X(0.12), Y(-0.34));  // 付け根へ
        ctx.closePath(); part(-0.1);
        ctx.beginPath(); // 内側の膜（クリーム）
        ctx.moveTo(X(0.3), Y(-0.36));
        ctx.quadraticCurveTo(X(0.82), Y(-1.28), X(1.56), Y(-1.34));
        ctx.quadraticCurveTo(X(1.34), Y(-0.96), X(1.6), Y(-0.74));
        ctx.quadraticCurveTo(X(1.24), Y(-0.74), X(1.38), Y(-0.34));
        ctx.quadraticCurveTo(X(1.04), Y(-0.4), X(1.06), Y(-0.02));

      { label: 'じゅもん', value: 'skill', icon: 'skill' },
      { label: 'どうぐ', value: 'item', icon: 'item' },
      { label: 'ぼうぎょ', value: 'defend', icon: 'defend' },
      { label: 'にげる', value: 'escape', disabled: this.isBoss, icon: 'escape' },
    ], { cols: 1, lineH: 28 });
  }

  // =================== UPDATE ===================
  update() {
    this.tick++;
    this._updatePopups();
    const a = this.game.audio;
    switch (this.phase) {
      case 'intro':
        if (--this.introT <= 0 || this.game.input.isPressed('confirm')) this.startInput();
        break;
      case 'cmd':   this.updateCmd(a); break;
      case 'skill': this.updateSkill(a); break;
      case 'item':  this.updateItem(a); break;
      case 'target':this.updateTarget(a); break;
      case 'exec':  this.updateExec(a); break;
      case 'message': this.updateMessage(a); break;
      case 'result':  this.updateResult(a); break;
    }
  }

  startInput() {
    this.commands.clear();
    this.inputOrder = this.players.filter((p) => !p.isDead);
    this.curIdx = 0;
    if (this.inputOrder.length === 0) return this.finish('lose');
    this.enterCmdFor(this.inputOrder[0]);
  }
  get curPlayer() { return this.inputOrder[this.curIdx]; }

  enterCmdFor(_player) { this.phase = 'cmd'; this.cmdMenu.index = 0; this.log = `${this.curPlayer.name} の こうどう`; }

  advancePlayer() {
    this.curIdx++;
    if (this.curIdx >= this.inputOrder.length) this.beginExec();
    else this.enterCmdFor(this.curPlayer);
  }
  backPlayer() {
    if (this.curIdx === 0) return;
    this.curIdx--;
    this.commands.delete(this.curPlayer);
    this.enterCmdFor(this.curPlayer);
  }

  updateCmd(a) {
    const res = this.cmdMenu.update(this.game.input, a);
    if (res === 'cancel') { this.backPlayer(); return; }
    if (res !== 'confirm') return;
    const v = this.cmdMenu.current.value;
    if (v === 'attack') { this.pending = { type: 'attack', skillId: 'attack' }; this.startTarget('enemy'); }
    else if (v === 'defend') { this.commands.set(this.curPlayer, { type: 'defend' }); this.advancePlayer(); }
    else if (v === 'escape') { this.commands.set(this.curPlayer, { type: 'escape' }); this.advancePlayer(); }
    else if (v === 'skill') this.openSkill();
    else if (v === 'item') this.openItem();
  }

  openSkill() {
    const usable = this.curPlayer.skills
      .map((id) => ({ id, sk: this.game.db.getSkill(id) }))
      .filter((s) => s.sk && s.id !== 'attack');
    if (usable.length === 0) { this.game.audio.se('cancel'); return; }
    this.skillMenu = new CommandWindow(
      usable.map((s) => ({
        value: s.id, label: s.sk.name, sub: `MP${s.sk.mp || 0}`,
        disabled: (s.sk.mp || 0) > this.curPlayer.curMp,
        icon: (s.sk.element && s.sk.element !== 'none') ? s.sk.element : (s.sk.type === 'heal' ? 'item' : 'skill'),
      })), { lineH: 26 });
    this.phase = 'skill';
  }
  updateSkill(a) {
    const res = this.skillMenu.update(this.game.input, a);
    if (res === 'cancel') { this.phase = 'cmd'; return; }
    if (res !== 'confirm') return;
    const skId = this.skillMenu.current.value;
    const sk = this.game.db.getSkill(skId);
    this.pending = { type: 'skill', skillId: skId };
    this.commitOrTarget(sk);
  }

  openItem() {
    const items = this.game.inventory.list().filter((e) => e.item.usableInBattle);
    if (items.length === 0) { this.game.audio.se('cancel'); return; }
    this.itemMenu = new CommandWindow(
      items.map((e) => ({ value: e.id, label: e.item.name, sub: `×${e.count}`, icon: e.item.type || 'item' })), { lineH: 26 });
    this.phase = 'item';
  }
  updateItem(a) {
    const res = this.itemMenu.update(this.game.input, a);
    if (res === 'cancel') { this.phase = 'cmd'; return; }
    if (res !== 'confirm') return;
    const itemId = this.itemMenu.current.value;
    const it = this.game.db.getItem(itemId);
    this.pending = { type: 'item', itemId };
    // 回復系は味方、それ以外は敵対象（簡易）
    const ef = it.effect || {};
    if (ef.hp || ef.mp || ef.cure || ef.revive) this.startTarget('ally', !!ef.revive);
    else this.startTarget('enemy');
  }

  /** スキルのターゲット要否を見て、対象選択 or 即確定 */
  commitOrTarget(sk) {
    if (sk.target === 'self') { this.commit({ target: this.curPlayer }); return; }
    if (sk.target === 'allEnemies' || sk.target === 'allAllies') { this.commit({}); return; }
    if (sk.type === 'heal' || sk.target === 'oneAlly') this.startTarget('ally');
    else if (sk.type === 'revive' || sk.target === 'deadAlly') this.startTarget('ally', true);
    else this.startTarget('enemy');
  }

  startTarget(kind, deadOnly = false) {
    this.targetKind = kind;
    const pool = kind === 'enemy'
      ? this.enemies.filter((e) => !e.isDead)
      : this.players.filter((p) => (deadOnly ? p.isDead : !p.isDead));
    this.targets = pool;
    this.targetIdx = 0;
    if (this.targets.length === 0) { this.phase = 'cmd'; return; }
    this.phase = 'target';
  }
  updateTarget(a) {
    if (this.game.input.isPressed('left') || this.game.input.isPressed('up'))
      { this.targetIdx = (this.targetIdx - 1 + this.targets.length) % this.targets.length; a.se('cursor'); }
    if (this.game.input.isPressed('right') || this.game.input.isPressed('down'))
      { this.targetIdx = (this.targetIdx + 1) % this.targets.length; a.se('cursor'); }
    if (this.game.input.isPressed('cancel')) { a.se('cancel'); this.phase = (this.pending.type === 'skill') ? 'skill' : (this.pending.type === 'item' ? 'item' : 'cmd'); return; }
    if (this.game.input.isPressed('confirm')) { a.se('confirm'); this.commit({ target: this.targets[this.targetIdx] }); }
  }

  commit(extra) {
    this.commands.set(this.curPlayer, { ...this.pending, ...extra });
    this.pending = null;
    this.advancePlayer();
  }

  // =================== EXECUTE ===================
  beginExec() {
    this.gen = this.system.resolveRound(this.commands, this.game.inventory);
    this.phase = 'exec';
    this.msgTimer = 0; this.flash = null;
    this.nextMessage();
  }
  nextMessage() {
    const n = this.gen.next();
    if (n.done) { this.afterRound(); return; }
    const m = n.value;
    this.log = m.text || this.log;
    this.flash = m.flash || null; this.flashT = 12;
    // 被弾/攻撃モーション用のトリガ（敵のみ。tickを起点に BattleUI が演出）
    if (m.flash && this.enemies.includes(m.flash)) m.flash._hitTick = this.tick;
    if (m.actor && this.enemies.includes(m.actor)) m.actor._atkTick = this.tick;
    if (m.fx) this._spawnSkillFx(m.fx);
    if (m.magic && m.flash) this._spawnHitFx(m.flash, m.element);
    if (m.popup) this.spawnPopup(m.popup);
    if (m.se) this.game.audio.se(m.se);
    this.msgTimer = m.text ? 40 : 1;
    this.phase = 'exec';
  }
  updateExec() {
    if (this.flashT > 0) this.flashT--;
    if (--this.msgTimer <= 0 || this.game.input.isPressed('confirm')) this.nextMessage();
  }

  afterRound() {
    if (this.system.isWin()) return this.beginResult();
    if (this.system.isLose()) { this.game.audio.defeat(); return this.showThen('ぜんめつ してしまった……', () => this.finish('lose')); }
    if (this.system.escaped) return this.finish('escape');
    // 次ラウンド
    this.players.forEach((p) => p.invalidate?.());
    this.startInput();
  }

  showThen(text, cb) {
    this.log = text; this.msgTimer = 70; this._after = cb; this.phase = 'message';
  }
  updateMessage() {
    if (--this.msgTimer <= 0 || this.game.input.isPressed('confirm')) { const cb = this._after; this._after = null; cb?.(); }
  }

  // =================== RESULT ===================
  beginResult() {
    const res = this.system.result();
    this.result = res;
    // 経験値・ゴールド配分（難易度でEXP補正：易+20%／難-10%）
    const diff = this.game.state.settings.difficulty;
    const expMul = diff === 'easy' ? 1.2 : (diff === 'hard' ? 0.9 : 1.0);
    res.exp = Math.floor(res.exp * expMul);
    this.levelups = [];
    const front = this.game.party.frontline();
    const reserve = this.game.state.party.reserve.map((id) => this.game.party.char(id)).filter(Boolean);
    const ratio = (c) => { const lo = LevelSystem.totalExpFor(c.lv), hi = LevelSystem.totalExpFor(c.lv + 1); return hi > lo ? Math.max(0, Math.min(1, (c.exp - lo) / (hi - lo))) : 1; };
    const rows = [];
    for (const c of front) {
      const lv0 = c.lv, r0 = ratio(c);
      const lus = LevelSystem.gainExp(c, res.exp, this.game.db);
      this.levelups.push(...lus);
      const learned = lus.flatMap((l) => l.learned || []).map((s) => this.game.db.getSkill(s)?.name || s);
      rows.push({ name: c.name, lv0, r0, lv1: c.lv, r1: ratio(c), up: c.lv > lv0, learned });
    }
    for (const c of reserve) LevelSystem.gainExp(c, Math.floor(res.exp * 0.5), this.game.db);
    this.game.party.gainGold(res.gold);
    for (const d of res.drops) this.game.inventory.add(d, 1);
    // 図鑑：撃破登録
    for (const e of this.enemies) if (!this.game.state.bestiary.defeated.includes(e.id)) this.game.state.bestiary.defeated.push(e.id);
    const dex = checkDexRewards(this.game);
    this.game.audio.victory(); // 勝利ファンファーレ
    this.resultData = { exp: res.exp, gold: res.gold, drops: res.drops.slice(), rows, dex };
    this.resultT = 0; this._luSe = false;
    this.log = '';
    this.phase = 'result';
  }
  updateResult(a) {
    this.resultT++;
    const DUR = 70;
    if (!this._luSe && this.resultT > 42 && this.resultData.rows.some((row) => row.up)) { this._luSe = true; a.se('levelup'); }
    if (this.game.input.isPressed('confirm')) {
      if (this.resultT < DUR) { this.resultT = DUR; }
      else { a.se('confirm'); this.finish('win'); }
    }
  }

  finish(outcome) {
    const result = outcome === 'win' ? { ...this.result, outcome } : { outcome };
    this.onComplete?.(result);
    this.game.scenes.pop();
  }

  // =================== RENDER ===================
  render(r) {
    // 背景（雰囲気のある手続き背景）
    drawBattleBg(r.ctx, { boss: this.isBoss, special: this.special, tick: this.tick, env: this.params?.env });

    // 画面シェイク（会心/弱点ヒット時、敵の描画をゆらす）
    let sx = 0, sy = 0;
    if (this.shakeT > 0) { const m = this.shakeMag * (this.shakeT / 12); sx = (Math.random() - 0.5) * m * 2; sy = (Math.random() - 0.5) * m * 2; }
    r.save(); r.translate(sx, sy);
    if (this.isBoss && this.phase === 'intro') { // 登場ズームイン
      const z = 1.7 - 0.7 * this._ease(this._introP());
      const cx = VIEW_W / 2, cy = 150;
      r.ctx.translate(cx, cy); r.ctx.scale(z, z); r.ctx.translate(-cx, -cy);
    }
    this.ui.drawEnemies(r, this.enemies, this.flashT > 0 ? this.flash : null, this.tick);
    r.restore();

    // 対象カーソル
    if (this.phase === 'target') {
      const t = this.targets[this.targetIdx];
      if (this.targetKind === 'enemy') {
        const i = this.enemies.indexOf(t);
        const cx = (VIEW_W / (this.enemies.length + 1)) * (i + 1);
        r.text('▼', cx, 95, { size: 22, align: 'center', color: COLORS.selected });
      }
    }

    // ボスHPバー（ボス戦）
    if (this.bossEnemy && !this.bossEnemy.isDead) {
      const bw = 360, bx = (VIEW_W - bw) / 2, by = 64;
      r.text(this.bossEnemy.def.name, bx, by - 18, { size: 14, color: '#ffd0d0' });
      r.gauge(bx, by, bw, 10, this.bossEnemy.curHp / this.bossEnemy.maxHp, '#d2526b');
      if (this.bossEnemy._broken) r.text('不死 崩壊', bx + bw - 70, by - 18, { size: 12, color: '#ffd23f' });
    }
    // 赦しゲージ（神戦のみ）
    if (this.special) {
      const f = this.game.state.variables.forgiveness || 0;
      const gw = 220, gx = (VIEW_W - gw) / 2, gy = 92;
      r.text(`赦し ${f}`, gx, gy - 16, { size: 12, color: '#aee0ff' });
      r.gauge(gx, gy, gw, 8, f / 100, '#aee0ff');
      const can = f >= 60;
      r.text(can ? '連携「ラスト・レクイエム」 解放中' : '赦しが 足りない…連携は 使えない',
        gx, gy + 12, { size: 11, color: can ? '#ffd23f' : '#9a6b6b' });
    }

    this.ui.drawLog(r, this.log);
    this.ui.drawPartyStatus(r, this.players, (this.phase === 'cmd' || this.phase === 'skill' || this.phase === 'item' || this.phase === 'target') ? this.curPlayer : null, this.tick);
    // 全体攻撃/魔法のエフェクト（敵・味方の上に加算）
    this._drawBfx(r);
    // 行動順（AGI順の予測）インジケータ
    if (this.phase === 'cmd' || this.phase === 'target') this._drawTurnOrder(r);

    // コマンド系ウィンドウ
    if (this.phase === 'cmd') { r.window(16, VIEW_H - 92, 150, 84); this.cmdMenu.render(r, 30, VIEW_H - 84, 130, this.game.assets); }
    if (this.phase === 'skill') { r.window(16, 70, 240, 200); r.text('じゅもん／スキル', 30, 78, { size: 14, color: COLORS.textDim }); this.skillMenu.render(r, 30, 104, 220, this.game.assets); }
    if (this.phase === 'item')  { r.window(16, 70, 240, 200); r.text('どうぐ', 30, 78, { size: 14, color: COLORS.textDim }); this.itemMenu.render(r, 30, 104, 220, this.game.assets); }
    if (this.phase === 'target' && this.targetKind === 'ally') {
      const t = this.targets[this.targetIdx];
      const i = this.players.indexOf(t);
      const w = VIEW_W / this.players.length;
      r.strokeRect(i * w + 4, VIEW_H - 92, w - 8, 84, COLORS.selected, 3);
    }

    // 浮き上がるダメージ/回復数字（弾む・縁取り・会心は特大＋光輪）
    const c = r.ctx;
    for (const p of this.popups) {
      const age = p.max - p.life;
      const pop = age < 5 ? 0.5 + 0.5 * (age / 5) : (age < 9 ? 1.14 - 0.14 * ((age - 5) / 4) : 1); // 出現時に弾む
      const alpha = Math.min(1, p.life / 12);
      if (p.kind === 'crit' && age < 12) { // 会心の光輪
        c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = (1 - age / 12) * 0.7;
        c.strokeStyle = '#ffe24a'; c.lineWidth = 3;
        c.beginPath(); c.arc(p.x, p.y, 8 + age * 4.5, 0, 7); c.stroke(); c.restore();
      }
      c.save();
      c.globalAlpha = alpha;
      c.translate(p.x, p.y); c.scale(pop, pop);
      c.font = `bold ${p.size}px sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
      c.lineWidth = Math.max(3, p.size * 0.18); c.strokeStyle = 'rgba(0,0,0,0.85)'; c.strokeText(p.text, 0, 0);
      c.fillStyle = p.color; c.fillText(p.text, 0, 0);
      c.restore();
    }

    // ボス登場演出（暗転リビール＋赤フラッシュ＋WARNINGバナー）は最前面
    if (this.isBoss && this.phase === 'intro') this._drawBossIntro(r);
    // 勝利リザルト演出
    if (this.phase === 'result') this._drawResult(r);
  }

  _drawResult(r) {
    const c = r.ctx, d = this.resultData; if (!d) return;
    const ap = Math.min(1, this.resultT / 70), ease = ap * ap * (3 - 2 * ap);
    const x = 60, y = 44, w = VIEW_W - 120, h = 322;
    r.window(x, y, w, h);
    // VICTORY タイトル（ポップ）
    const pop = this.resultT < 12 ? this.resultT / 12 : 1;
    c.save(); c.translate(x + w / 2, y + 30); c.scale(pop, pop);
    c.font = 'bold 30px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
    c.lineWidth = 5; c.strokeStyle = 'rgba(0,0,0,0.85)'; c.strokeText('VICTORY!', 0, 0);
    c.fillStyle = '#ffd23f'; c.fillText('VICTORY!', 0, 0); c.restore();
    // EXP / GOLD カウントアップ
    r.text('けいけんち', x + 26, y + 60, { size: 14, color: COLORS.textDim });
    r.text(`${Math.floor(d.exp * ease)}`, x + 150, y + 58, { size: 18, color: COLORS.exp });
    r.text('ゴールド', x + 26, y + 88, { size: 14, color: COLORS.textDim });
    r.text(`${Math.floor(d.gold * ease)}`, x + 150, y + 86, { size: 18, color: '#ffd23f' });
    // ドロップ（アイコン）
    r.text('入手', x + 270, y + 56, { size: 13, color: COLORS.textDim });
    if (d.drops.length) {
      d.drops.forEach((id, i) => { const it = this.game.db.getItem(id); this.game.assets.drawIcon(c, x + 296, y + 66 + i * 22, 7, it?.type || 'item'); r.text(it ? it.name : id, x + 310, y + 60 + i * 22, { size: 13 }); });
    } else r.text('なし', x + 296, y + 60, { size: 13, color: COLORS.textDim });
    // パーティ EXP バー
    d.rows.forEach((row, i) => {
      const ry = y + 132 + i * 40, bw = w - 250, bx = x + 210;
      r.text(row.name, x + 26, ry, { size: 15 });
      r.text(`Lv ${row.up && ease < 0.9 ? row.lv0 : row.lv1}`, x + 140, ry, { size: 13, color: row.up ? '#ffd23f' : COLORS.text });
      const ratio = row.up ? ease : (row.r0 + (row.r1 - row.r0) * ease);
      r.gauge(bx, ry + 2, bw, 11, Math.min(1, ratio), COLORS.exp);
      if (row.up && ease > 0.55) {
        const bl = 0.6 + 0.4 * Math.sin(this.tick * 0.3);
        c.save(); c.globalAlpha = bl; r.text('LEVEL UP!', bx + bw - 96, ry - 1, { size: 13, color: '#ffd23f' }); c.restore();
      }
      if (row.learned.length && ease > 0.9) r.text(`▶ ${row.learned.join('・')} を おぼえた！`, bx, ry + 16, { size: 11, color: '#aee0ff' });
    });
    // 図鑑報酬
    if (d.dex && d.dex.length && ease > 0.9) r.text(`★ ${d.dex[0]}`, x + 26, y + h - 44, { size: 12, color: '#ffd23f' });
    // 続行プロンプト
    if (ap >= 1) { const bl = 0.5 + 0.5 * Math.sin(this.tick * 0.2); c.save(); c.globalAlpha = bl; r.text('▼ かくにん', x + w - 110, y + h - 26, { size: 13, color: COLORS.selected }); c.restore(); }
  }

  _introP() { return Math.max(0, Math.min(1, (this.introMax - this.introT) / this.introMax)); }
  _ease(p) { return p * p * (3 - 2 * p); }

  _drawTurnOrder(r) {
    const order = [...this.players, ...this.enemies].filter((a) => !a.isDead).sort((x, y) => (y.agi || 0) - (x.agi || 0));
    if (order.length < 2) return;
    const c = r.ctx, tw = 30, x0 = 24, y = this.bossEnemy ? 98 : 64;
    r.text('行動順（予測）', x0, y - 15, { size: 11, color: COLORS.textDim });
    order.forEach((a, i) => {
      const tx = x0 + i * tw, cur = a === this.curPlayer;
      const col = a.isPlayer ? (this.game.db.getCharacter(a.id)?.color || '#4fb2ff') : this.ui._famColor(a.family);
      c.save();
      r.roundPath(tx, y, 24, 24, 4); c.fillStyle = col; c.fill();
      const g = c.createLinearGradient(0, y, 0, y + 24); g.addColorStop(0, 'rgba(255,255,255,0.28)'); g.addColorStop(0.5, 'rgba(255,255,255,0)');
      r.roundPath(tx, y, 24, 24, 4); c.fillStyle = g; c.fill();
      c.lineWidth = cur ? 2.5 : 1; c.strokeStyle = cur ? COLORS.selected : 'rgba(0,0,0,0.6)'; r.roundPath(tx, y, 24, 24, 4); c.stroke();
      c.restore();
      c.fillStyle = '#fff'; c.font = 'bold 13px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillText((a.name || '?').slice(0, 1), tx + 13, y + 13);
      c.fillStyle = '#fff'; c.fillText((a.name || '?').slice(0, 1), tx + 12, y + 12);
      if (cur) r.text('▼', tx + 7, y - 13, { size: 12, color: COLORS.selected });
      if (i < order.length - 1) r.text('›', tx + 25, y + 4, { size: 14, color: COLORS.textDim });
    });
  }

  _drawBossIntro(r) {
    const c = r.ctx, p = this._introP();
    c.save();
    c.fillStyle = `rgba(2,2,8,${Math.pow(1 - p, 1.4) * 0.88})`; c.fillRect(0, 0, VIEW_W, VIEW_H); // 暗転→リビール
    c.restore();
    if (p < 0.18) { // 開幕の赤フラッシュ
      c.save(); c.globalCompositeOperation = 'lighter';
      c.fillStyle = `rgba(150,20,30,${(0.18 - p) / 0.18 * 0.5})`; c.fillRect(0, 0, VIEW_W, VIEW_H); c.restore();
    }
    if (p > 0.15) { // WARNINGバナー
      const out = p > 0.82 ? (p - 0.82) / 0.18 : 0;
      const a = 1 - out, by = 196, bh = 56;
      c.save(); c.globalAlpha = a;
      const g = c.createLinearGradient(0, by, 0, by + bh);

  machine: '#9aa6b8', aqua: '#3fa9d8', flying: '#d8c23f', dragon: '#c0392b',
  elemental: '#e0533f', demon: '#7e57c2', boss: '#b03060', slime: '#5fd38a',
  mage: '#6a5acd', spirit: '#6fd0ff',
};
const FAM_LABEL = {
  beast: '獣', plant: '植物', insect: '蟲', undead: '不死', machine: '機械', aqua: '水',
  flying: '飛行', dragon: '竜', elemental: '精霊', demon: '魔', boss: '魔王', slime: 'スライム', mage: '魔導', spirit: '精霊',
};
// 状態異常の凡例（戦闘表示の記号・色と効果）
const STATUS_LEGEND = [
  { char: '毒', color: '#7fd96b', name: 'どく', desc: 'まいターン HPが すこしずつ 減る。' },
  { char: 'Z', color: '#bfe0ff', name: 'ねむり', desc: '行動できない。物理こうげきで 目を覚ます。' },
  { char: '雷', color: '#ffe24a', name: 'まひ', desc: 'ときどき 行動できなくなる。' },
  { char: '黙', color: '#c9b6ff', name: 'ちんもく', desc: 'じゅもん／スキルが 使えない。' },
  { char: '?', color: '#ff9ad2', name: 'こんらん', desc: '行動が 乱れ、味方を ねらうことも。' },
  { char: '暗', color: '#9aa6b8', name: 'くらやみ', desc: '命中率が 下がる。' },
];

class MenuScene extends Scene {
  constructor(game) { super(game); this.opaque = false; this.toast = ''; this.toastT = 0; }

  onEnter() {
    this.state = 'root';
    this.root = new CommandWindow([
      { value: 'status', label: 'つよさ' },
      { value: 'item', label: 'どうぐ' },
      { value: 'equip', label: 'そうび' },
      { value: 'skill', label: 'じゅもん' },
      { value: 'formation', label: 'メンバー' },
      { value: 'bestiary', label: 'ずかん' },
      { value: 'save', label: 'セーブ' },
      { value: 'config', label: 'せってい' },
      { value: 'title', label: 'タイトルへ' },
      { value: 'close', label: 'とじる' },
    ]);
    this.party = this.game.party.frontline().concat(
      this.game.state.party.reserve.map((id) => this.game.party.char(id)).filter(Boolean));
  }
  onResume() {}

  setToast(t) { this.toast = t; this.toastT = 120; }

  update() {
    const input = this.game.input, a = this.game.audio;
    if (this.toastT > 0) this.toastT--;
    switch (this.state) {
      case 'root': return this.updRoot(a);
      case 'status': return this.updStatus(a);
      case 'item': return this.updItem(a);
      case 'item_target': return this.updItemTarget(a);
      case 'equip_char': return this.updEquipChar(a);
      case 'equip_slot': return this.updEquipSlot(a);
      case 'equip_item': return this.updEquipItem(a);
      case 'skill_char': return this.updSkillChar(a);
      case 'skill_view': return this.updSkillView(a);
      case 'formation': return this.updFormation(a);
      case 'bestiary': return this.updBestiary(a);
      case 'quit': return this.updQuit(a);
      case 'save': return this.updSave(a);
    }
  }

  updRoot(a) {
    const res = this.root.update(this.game.input, a);
    if (res === 'cancel') return this.close();
    if (res !== 'confirm') return;
    switch (this.root.current.value) {
      case 'status': this.charIdx = 0; this.state = 'status'; break;
      case 'item': this.openItem(); break;
      case 'equip': this.openCharSelect('equip_char'); break;
      case 'skill': this.openCharSelect('skill_char'); break;
      case 'formation': this.openFormation(); break;
      case 'bestiary': this.openBestiary(); break;
      case 'save': this.openSave(); break;
      case 'config': this.game.scenes.push(new SettingsScene(this.game)); break;
      case 'title': this.openQuit(); break;
      case 'close': this.close();
    }
  }

  openQuit() {
    this.quitMenu = new CommandWindow([
      { value: 'no', label: 'いいえ' },
      { value: 'yes', label: 'はい（タイトルへ）' },
    ]);
    this.state = 'quit';
  }
  updQuit(a) {
    const res = this.quitMenu.update(this.game.input, a);
    if (res === 'cancel') { a.se('cancel'); this.state = 'root'; return; }
    if (res === 'confirm') {
      if (this.quitMenu.current.value === 'yes') {
        a.se('confirm');
        __dynreq('src/scenes/TitleScene.js').then(({ TitleScene }) => {
          this.game.audio.stopBgm();
          this.game.scenes.reset(new TitleScene(this.game));
        });
      } else { this.state = 'root'; }
    }
  }
  close() { this.game.audio.se('cancel'); this.game.scenes.pop(); }

  // --- つよさ ---
  updStatus(a) {
    if (this.game.input.isPressed('left'))  { this.charIdx = (this.charIdx - 1 + this.party.length) % this.party.length; a.se('cursor'); }
    if (this.game.input.isPressed('right')) { this.charIdx = (this.charIdx + 1) % this.party.length; a.se('cursor'); }
    if (this.game.input.isPressed('cancel')) { a.se('cancel'); this.state = 'root'; }
  }

  // --- どうぐ ---
  openItem() {
    const items = this.game.inventory.list();
    if (!items.length) { this.setToast('どうぐを 持っていない。'); return; }
    this.itemList = items;
    this.itemMenu = new CommandWindow(items.map((e) => ({
      value: e.id, label: e.item.name, sub: `×${e.count}`, icon: e.item.type || 'item',
    })), { lineH: 26 });
    this.state = 'item';
  }
  updItem(a) {
    const res = this.itemMenu.update(this.game.input, a);
    if (res === 'cancel') { this.state = 'root'; return; }
    if (res !== 'confirm') return;
    const id = this.itemMenu.current.value;
    const it = this.game.db.getItem(id);
    const ef = it.effect || {};
    if (it.usableInField && (ef.hp || ef.mp || ef.cure || ef.revive || ef.raise)) {
      this.pendingItem = id; this.targetIdx = 0; this.state = 'item_target';
    } else {
      this.setToast('ここでは つかえない。');
    }
  }
  updItemTarget(a) {
    if (this.game.input.isPressed('up'))   { this.targetIdx = (this.targetIdx - 1 + this.party.length) % this.party.length; a.se('cursor'); }
    if (this.game.input.isPressed('down')) { this.targetIdx = (this.targetIdx + 1) % this.party.length; a.se('cursor'); }
    if (this.game.input.isPressed('cancel')) { this.state = 'item'; return; }
    if (this.game.input.isPressed('confirm')) {
      const target = this.party[this.targetIdx];
      const it = this.game.db.getItem(this.pendingItem);
      const ef = it.effect || {};
      if (ef.revive && !target.isDead) { this.setToast('効果が なかった。'); return; }
      if (!ef.revive && target.isDead) { this.setToast('せんとうふのうには つかえない。'); return; }
      this.game.inventory.remove(this.pendingItem, 1);
      if (ef.revive && target.isDead) target.curHp = Math.floor(target.maxHp * ef.revive);
      if (ef.hp) target.curHp += ef.hp;
      if (ef.mp) target.curMp += ef.mp;
      if (ef.cure) ef.cure.forEach((s) => { target.member.statusEffects = target.member.statusEffects.filter((x) => x.id !== s); });
      if (ef.raise) { // 永続ステータスアップ
        const bs = (target.member.bonusStats ||= {});
        for (const [k, v] of Object.entries(ef.raise)) bs[k] = (bs[k] || 0) + v;
        target.invalidate();
      }
      a.se(ef.raise ? 'levelup' : 'heal');
      this.setToast(`${target.name}に ${it.name}を つかった。`);
      if (!this.game.inventory.has(this.pendingItem)) { this.openItem(); }
      else { this.itemMenu.setItems(this.game.inventory.list().map((e) => ({ value: e.id, label: e.item.name, sub: `×${e.count}`, icon: e.item.type || 'item' }))); this.state = 'item'; }
    }
  }

  // --- そうび / じゅもん 共通：キャラ選択 ---
  openCharSelect(next) {
    this.charIdx = 0; this._afterChar = next; this.state = next;
  }
  updEquipChar(a) {
    if (this.charNav(a)) return;
    if (this.game.input.isPressed('confirm')) { this.char = this.party[this.charIdx]; this.slotIdx = 0; this.state = 'equip_slot'; a.se('confirm'); }
  }
  updSkillChar(a) {
    if (this.charNav(a)) return;
    if (this.game.input.isPressed('confirm')) { this.char = this.party[this.charIdx]; this.state = 'skill_view'; a.se('confirm'); }
  }
  charNav(a) {
    if (this.game.input.isPressed('up'))   { this.charIdx = (this.charIdx - 1 + this.party.length) % this.party.length; a.se('cursor'); }
    if (this.game.input.isPressed('down')) { this.charIdx = (this.charIdx + 1) % this.party.length; a.se('cursor'); }
    if (this.game.input.isPressed('cancel')) { a.se('cancel'); this.state = 'root'; return true; }
    return false;
  }

  // --- そうび：スロット選択 → アイテム選択 ---
  updEquipSlot(a) {
    if (this.game.input.isPressed('up'))   { this.slotIdx = (this.slotIdx - 1 + EQUIP_SLOTS.length) % EQUIP_SLOTS.length; a.se('cursor'); }
    if (this.game.input.isPressed('down')) { this.slotIdx = (this.slotIdx + 1) % EQUIP_SLOTS.length; a.se('cursor'); }
    if (this.game.input.isPressed('cancel')) { a.se('cancel'); this.state = 'equip_char'; return; }
    if (this.game.input.isPressed('confirm')) { this.openEquipItems(); }
  }
  openEquipItems() {
    const slot = EQUIP_SLOTS[this.slotIdx];
    const wanted = slot === 'weapon' ? ['weapon'] : slot === 'shield' ? ['shield'] :
      slot === 'head' ? ['head'] : slot === 'body' ? ['body'] : ['accessory'];
    const candidates = this.game.inventory.list().filter((e) =>
      wanted.includes(e.item.type) && this.game.inventory.canEquip(this.char, e.id));
    const items = [{ value: '__none', label: '（はずす）' }].concat(candidates.map((e) => ({
      value: e.id, label: e.item.name, sub: this.equipDelta(slot, e.id), icon: e.item.type || 'material',
    })));
    this.equipMenu = new CommandWindow(items, { lineH: 26 });
    this.state = 'equip_item';
  }
  equipDelta(slot, itemId) {
    const it = this.game.db.getItem(itemId);
    const b = it.bonus || {};
    const main = slot === 'weapon' ? `攻+${b.atk || 0}` : (b.def ? `守+${b.def}` : (b.mdf ? `魔守+${b.mdf}` : ''));
    return main;
  }
  updEquipItem(a) {
    const res = this.equipMenu.update(this.game.input, a);
    if (res === 'cancel') { this.state = 'equip_slot'; return; }
    if (res !== 'confirm') return;
    const slot = EQUIP_SLOTS[this.slotIdx];
    const v = this.equipMenu.current.value;
    if (v === '__none') {
      const prev = this.char.member.equip[slot];
      if (prev) { this.game.inventory.add(prev, 1); this.char.unequip(slot); a.se('confirm'); this.setToast('はずした。'); }
    } else {
      this.game.inventory.equip(this.char, v, slot);
      a.se('confirm'); this.setToast(`${this.game.db.getItem(v).name}を そうびした。`);
    }
    this.char.ensureVitals();
    this.state = 'equip_slot';
  }
  updSkillView(a) {
    if (this.game.input.isPressed('cancel')) { a.se('cancel'); this.state = 'skill_char'; }
  }

  // --- メンバー編成（前衛↔控え 入れ替え） ---
  openFormation() { this.fmIdx = 0; this.fmGrab = -1; this.state = 'formation'; }
  get fmFlat() { return [...this.game.state.party.order, ...this.game.state.party.reserve]; }
  get fmFront() { return this.game.state.party.order.length; }
  refreshParty() {
    this.party = this.game.party.frontline().concat(
      this.game.state.party.reserve.map((id) => this.game.party.char(id)).filter(Boolean));
  }
  updFormation(a) {
    const input = this.game.input;
    const n = this.fmFlat.length;
    if (input.isPressed('up'))   { this.fmIdx = (this.fmIdx - 1 + n) % n; a.se('cursor'); }
    if (input.isPressed('down')) { this.fmIdx = (this.fmIdx + 1) % n; a.se('cursor'); }
    if (input.isPressed('cancel')) {
      if (this.fmGrab >= 0) { this.fmGrab = -1; a.se('cancel'); }
      else { a.se('cancel'); this.state = 'root'; }
      return;
    }
    if (input.isPressed('confirm')) {
      if (this.fmGrab < 0) { this.fmGrab = this.fmIdx; a.se('confirm'); }
      else {
        if (this.fmGrab !== this.fmIdx) {
          this.game.party.swapPositions(this.fmGrab, this.fmIdx);
          a.se('confirm'); this.setToast('へんせいを 変えた。'); this.refreshParty();
        } else a.se('cancel');
        this.fmGrab = -1;
      }
    }
  }

  // --- 図鑑（モンスター / アイテム タブ切替） ---
  openBestiary() {
    this.bestMode = 'monster';
    this.monIds = Object.keys(this.game.db.monsters).filter((id) => !this.game.db.monsters[id].dexExclude);
    this.itemIds = Object.keys(this.game.db.items);
    this.monIdx = 0; this.itemIdx = 0;
    this.state = 'bestiary';
    const rewards = checkDexRewards(this.game);
    if (rewards.length) { this.setToast(rewards[rewards.length - 1]); this.game.audio.se('levelup'); }
  }
  updBestiary(a) {
    const input = this.game.input;
    const modes = ['monster', 'item', 'status'];
    if (input.isPressed('right')) { this.bestMode = modes[(modes.indexOf(this.bestMode) + 1) % 3]; a.se('cursor'); }
    if (input.isPressed('left'))  { this.bestMode = modes[(modes.indexOf(this.bestMode) + 2) % 3]; a.se('cursor'); }
    if (this.bestMode !== 'status') {
      const ids = this.bestMode === 'monster' ? this.monIds : this.itemIds;
      const key = this.bestMode === 'monster' ? 'monIdx' : 'itemIdx';
      if (input.isPressed('up'))   { this[key] = (this[key] - 1 + ids.length) % ids.length; a.se('cursor'); }
      if (input.isPressed('down')) { this[key] = (this[key] + 1) % ids.length; a.se('cursor'); }
    }
    if (input.isPressed('cancel')) { a.se('cancel'); this.state = 'root'; }
  }

  // --- セーブ ---
  openSave() {
    this.saveList = SaveManager.list().filter((s) => s.slot > 0);
    this.saveMenu = new CommandWindow(this.saveList.map((s) => ({ value: s.slot })), { lineH: 28 });
    this.state = 'save';
  }
  updSave(a) {
    const res = this.saveMenu.update(this.game.input, a);
    if (res === 'cancel') { this.state = 'root'; return; }
    if (res !== 'confirm') return;
    // 現在地を同期してから保存（直前のFieldSceneがstackにある）
    const field = this.game.scenes.stack.find((s) => s.syncLocation);
    field?.syncLocation();
    const ok = SaveManager.save(this.saveMenu.current.value, this.game.state, this.game.db);
    a.se(ok ? 'confirm' : 'cancel');
    this.setToast(ok ? 'ぼうけんのしょに きろくした！' : 'きろくに しっぱいした。');
    this.openSave();
  }

  // =================== RENDER ===================
  render(r) {
    r.rect(0, 0, VIEW_W, VIEW_H, 'rgba(4,6,16,0.7)');
    // 左：ルートメニュー
    r.window(16, 16, 150, 250);
    this.root.render(r, 30, 30, 130);
    r.window(16, 276, 150, 50);
    r.text(`${this.game.party.gold} ギル`, 30, 292, { size: 16, color: COLORS.selected });

    const px = 180, pw = 200;
    switch (this.state) {
      case 'root':
        MenuUI.partyList(r, this.party, px, 16, pw, -1); break;
      case 'status':
        MenuUI.detail(r, this.party[this.charIdx], px, 16, VIEW_W - px - 16, 440, this.game.assets);
        r.text('← →で キャラ切替', VIEW_W - 220, VIEW_H - 26, { size: 12, color: COLORS.textDim }); break;
      case 'item': case 'item_target':
        r.window(px, 16, 300, 360); this.itemMenu.render(r, px + 14, 30, 280, this.game.assets);
        if (this.state === 'item_target') {
          MenuUI.partyList(r, this.party, px + 320, 16, 200, this.targetIdx);
          r.text('だれに つかう？', px + 320, VIEW_H - 70, { size: 13, color: COLORS.selected });
        } else {
          const e = this.itemList[this.itemMenu.index];
          if (e) { r.window(px + 320, 16, 200, 130); r.text(e.item.name, px + 334, 30, { size: 16, color: COLORS.selected });
            wrapText(r, e.item.desc || '', px + 334, 58, 170, 16); }
        }
        break;
      case 'equip_char': case 'skill_char':
        MenuUI.partyList(r, this.party, px, 16, pw, this.charIdx);
        r.text(this.state === 'equip_char' ? 'だれの そうび？' : 'だれの じゅもん？', px, VIEW_H - 40, { size: 14, color: COLORS.selected });
        break;
      case 'equip_slot': case 'equip_item':
        this.renderEquip(r, px); break;
      case 'skill_view':
        this.renderSkills(r, px); break;
      case 'formation':
        this.renderFormation(r, px); break;
      case 'bestiary':
        this.renderBestiary(r, px); break;
      case 'quit':
        r.window(px, 60, 320, 130);
        r.text('タイトルに もどりますか?', px + 20, 80, { size: 16, color: COLORS.selected });
        r.text('（セーブしていない 進行は 失われます）', px + 20, 108, { size: 12, color: COLORS.textDim });
        this.quitMenu.render(r, px + 20, 132, 280);
        break;
      case 'save':
        r.window(px, 16, 360, 40); r.text('どこに きろくする？', px + 16, 24, { size: 15, color: COLORS.textDim });
        MenuUI.saveSlots(r, px, 62, 360, this.saveList, this.saveMenu.index, this.game.assets); break;
    }
    if (this.toastT > 0) {
      r.window(VIEW_W / 2 - 180, VIEW_H - 56, 360, 40);
      r.text(this.toast, VIEW_W / 2, VIEW_H - 46, { size: 15, align: 'center', color: COLORS.selected });
    }
  }

  renderEquip(r, px) {
    const c = this.char;
    r.window(px, 16, 250, 230); r.text(`${c.name} の そうび`, px + 14, 26, { size: 16, color: COLORS.selected });
    EQUIP_SLOTS.forEach((slot, i) => {
      const yy = 62 + i * 30;
      const sel = (this.state === 'equip_slot') && i === this.slotIdx;
      const itId = c.member.equip[slot];
      const lv = itId ? this.game.inventory.enhLevel(c.member, itId) : 0;
      const def = itId ? this.game.db.getItem(itId) : null;
      const name = def ? `${def.name}${lv ? ` +${lv}` : ''}` : '—';
      const slotKind = { weapon: 'weapon', shield: 'shield', head: 'head', body: 'body', acc1: 'accessory', acc2: 'accessory' };
      if (sel) r.text('▶', px + 12, yy, { size: 16, color: COLORS.selected });
      this.game.assets.drawIcon(r.ctx, px + 30, yy + 8, 7, slotKind[slot] || 'material');
      r.text(SLOT_LABEL[slot], px + 44, yy, { size: 14, color: COLORS.textDim });
      r.text(name, px + 110, yy, { size: 14, color: sel ? COLORS.selected : COLORS.text });
      if (def && def.element && def.element !== 'none') this.game.assets.drawIcon(r.ctx, px + 234, yy + 8, 7, def.element);
    });
    if (this.state === 'equip_item') {
      r.window(px + 260, 16, 250, 360); r.text(`${SLOT_LABEL[EQUIP_SLOTS[this.slotIdx]]}を えらぶ`, px + 274, 26, { size: 14, color: COLORS.textDim });
      this.equipMenu.render(r, px + 274, 56, 230, this.game.assets);
    }
  }
  renderSkills(r, px) {
    const c = this.char;
    r.window(px, 16, VIEW_W - px - 16, 440);
    r.text(`${c.name} の おぼえている じゅもん／スキル`, px + 14, 26, { size: 15, color: COLORS.selected });
    const skills = c.skills.map((id) => this.game.db.getSkill(id)).filter(Boolean);
    skills.forEach((sk, i) => {
      const y = 62 + i * 34;
      r.text(sk.name, px + 20, y, { size: 16 });
      r.text(sk.mp ? `MP${sk.mp}` : '', px + 150, y, { size: 13, color: COLORS.mp });
      r.text(sk.desc || '', px + 210, y, { size: 13, color: COLORS.textDim });
    });
    r.text('キャンセルで もどる', px + 14, VIEW_H - 30, { size: 12, color: COLORS.textDim });
  }
  renderFormation(r, px) {
    r.window(px, 16, VIEW_W - px - 16, 440);
    r.text('メンバー編成', px + 14, 24, { size: 16, color: COLORS.selected });
    r.text('決定で つかむ → もう一度 決定で 入れ替え', px + 14, 48, { size: 12, color: COLORS.textDim });
    const flat = this.fmFlat, front = this.fmFront;
    flat.forEach((id, i) => {
      const c = this.game.party.char(id);
      const y = 78 + i * 44;
      const sel = i === this.fmIdx, grab = i === this.fmGrab;
      const zone = i < front ? '前衛' : '控え';
      const zc = i < front ? COLORS.hp : COLORS.textDim;
      if (sel) r.text(grab ? '◆' : '▶', px + 14, y, { size: 18, color: COLORS.selected });
      r.text(`[${zone}]`, px + 36, y, { size: 13, color: zc });
      r.text(c ? c.name : id, px + 96, y, { size: 17, color: grab ? COLORS.selected : COLORS.text });
      if (c) {
        r.text(`Lv${c.lv}`, px + 220, y, { size: 14, color: COLORS.textDim });
        r.gauge(px + 270, y + 4, 120, 8, c.curHp / c.maxHp, COLORS.hp);
        r.text(`${c.curHp}/${c.maxHp}`, px + 270, y + 14, { size: 11, color: COLORS.textDim });
      }
    });
    r.text('前衛(上から4人)が 戦闘に 参加。控えにも 経験値が 入る。', px + 14, VIEW_H - 30, { size: 12, color: COLORS.textDim });
